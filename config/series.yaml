    fonte: Ipeadata
    produtor: Banco Central do Brasil
    codigo_origem: PAN12_TJOVER12
    frequencia: M
    tipo_medida: taxa
    unidade: "% a.a."
    ajuste_sazonal: false
    episodios: ["1981-1982", "2007-2009", "2020"]
    url: http://www.ipeadata.gov.br/
    aviso_metodologia: "Em 1981-1982 a taxa nominal acompanha a inflação da época; fora de H1 (D25)."
    conferido_em: >-
      2026-11-17: unidade "(% a.a.)", "percentagem anualizada: elaboração IPEA"; não precisa
      de conversão. 1974-01 a 2026-11, sem lacunas nas três janelas.

  eua_inflacao:
