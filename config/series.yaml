    frequencia: M
    tipo_medida: taxa
    unidade: "% em 12 meses"
    ajuste_sazonal: true
    episodios: ["1981-1982", "2007-2009", "2020"]
    url: https://fred.stlouisfed.org/series/CPIAUCSL
    faixa: [10, 1000]   # valor bruto: número-índice do CPI
    tratamentos: [var_12m]

  br_inflacao:
    nome: Inflação ao consumidor em 12 meses (Brasil, IPCA)
    pais: BR
    grupo: inflacao
    fonte: IBGE/SIDRA
    produtor: IBGE
    codigo_origem: "1737"
    frequencia: M
    tipo_medida: taxa
