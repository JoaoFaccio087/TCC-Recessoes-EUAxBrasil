    pais: BR
    grupo: pib
    fonte: IBGE/SIDRA
    produtor: IBGE
    codigo_origem: "1621"
    frequencia: T
    tipo_medida: nivel
    unidade: "índice 1995=100"
    ajuste_sazonal: true
    episodios: ["2007-2009", "2020"]
    url: https://sidra.ibge.gov.br/tabela/1621
    sidra: {tabela: 1621, nivel: n1, variavel: 584, classificacoes: {"11255": "90707"}}
    unidade_fonte: Número-índice
    conferido_em: >-
      2026-11-17: tabela 1621, variável 584 (índice de volume com ajuste sazonal, média
      1995 = 100), categoria 90707 = "PIB a preços de mercado"; 1996T1 a 2026T2.

  br_pib_anual:
    nome: PIB, variação anual (Brasil)
    pais: BR
    grupo: pib
    fonte: Ipeadata
    produtor: IBGE
    codigo_origem: SCN10_PIBG10
    frequencia: A
    tipo_medida: taxa
    unidade: "% a.a."
    ajuste_sazonal: false
    episodios: ["1981-1982"]
    url: http://www.ipeadata.gov.br/
    apenas_ficha: true
    aviso_metodologia: "Só na ficha do episódio, fora das métricas (D12)."

  eua_acoes:
    nome: Ações, índice real (EUA)
    pais: EUA
    grupo: acoes
    fonte: FRED
    produtor: OECD
    codigo_origem: SPASTT01USM661N
    frequencia: M
    tipo_medida: nivel
    unidade: "índice deflacionado pelo CPI"
    ajuste_sazonal: false
    episodios: ["1981-1982", "2007-2009", "2020"]
    url: https://fred.stlouisfed.org/series/SPASTT01USM661N
    tratamentos: [{deflacionar: eua_cpi}]
    conferido_em: "2026-11-17: índice 2015=100, nominal, sem ajuste sazonal, 1957-01 a 2026-10."

  br_acoes:
    nome: Ibovespa real (Brasil)
    pais: BR
    grupo: acoes
    fonte: Ipeadata
    produtor: B3
    codigo_origem: GM12_IBVSP12
    frequencia: M
    tipo_medida: nivel
    unidade: "número-índice real (dez/1993 = 100), encadeado e deflacionado pelo IPCA"
    ajuste_sazonal: false
    episodios: ["1981-1982", "2007-2009", "2020"]
    url: http://www.ipeadata.gov.br/
    faixa: [-90, 300]   # valor bruto: variação % mensal nominal
    # Base dez/1993 = 100, a mesma do IPCA (var. 2266): o índice real fica a preços de dez/1993.
    tratamentos: [{encadear_variacao: "1993-12"}, {deflacionar: br_ipca_indice}]
    aviso_metodologia: >-
      O IPCA começa em 1979-12: os meses anteriores da janela de 1981-1982 ficam sem dados.
    conferido_em: >-
      2026-11-17: "Índice de ações - Ibovespa - fech: acumulada no mês" (% a.m.), Anbima,
      1968-02 a 2026-11, sem lacunas.

  # ------------------------------------------------------------ séries auxiliares (deflatores)
  eua_cpi:
    nome: CPI-U, número-índice (EUA)
    pais: EUA
