# Mapa das séries (engenharia_de_dados.md, seção 4.1).
# `conferir` lista o que depende de consulta à fonte. Ao conferir, registrar
# o resultado e a data em `conferido_em` e remover o item de `conferir`.
#
# Campos:
#   pais: BR | EUA
#   grupo: chave de regras.yaml (limiar, N, sentido adverso)
#   fonte: FRED | Ipeadata | IBGE/SIDRA | Comex Stat
#   frequencia: M | T | A
#   tipo_medida: nivel | taxa
#   episodios: episódios em que a série é usada
#   apenas_ficha: true = só aparece na ficha, fora das métricas (D12)
#   faixa: [mín, máx] plausível; fora dela a observação vai para observacao_rejeitada (D15).
#          Sem faixa: nível precisa ser > 0; taxa não tem limite.
#   sidra: parâmetros da API SIDRA (tabela, nivel, variavel, classificacoes)
#   unidade_fonte: unidade esperada na resposta da fonte (checada na Silver, se informada)
#   comexstat: parâmetros da API do Comex Stat (pais, fluxo)
#   auxiliar: true = só serve de insumo a tratamentos (deflator); fora das métricas e da dim_serie
#   tratamentos: passos 1 a 3 do texto 7.3 (tratamentos.py): encadear_variacao,
#                {deflacionar: <id_serie auxiliar>}, var_12m, stl

series:
  eua_prod_ind:
    nome: Produção industrial (EUA)
    pais: EUA
    grupo: producao_industrial
    fonte: FRED
    produtor: Federal Reserve Board
    codigo_origem: INDPRO
    frequencia: M
    tipo_medida: nivel
    unidade: "índice 2017=100"
    ajuste_sazonal: true
    episodios: ["1981-1982", "2007-2009", "2020"]
    url: https://fred.stlouisfed.org/series/INDPRO
    faixa: [10, 300]

  br_prod_ind_antiga:
    nome: Produção industrial geral (Brasil, série antiga)
    pais: BR
    grupo: producao_industrial
    fonte: Ipeadata
    produtor: IBGE
    codigo_origem: PIMPFN12_QIIG12
    frequencia: M
    tipo_medida: nivel
    unidade: "índice (média 2002 = 100)"
    ajuste_sazonal: false
    episodios: ["1981-1982"]
    url: http://www.ipeadata.gov.br/
    tratamentos: [stl]
    conferido_em: >-
      2026-11-17: "Produção industrial - indústria geral - quantum - índice (média 2002 = 100) -
      INATIVA", 1975-01 a 2014-02, sem lacunas; série antiga unida à nova em jan/1991 pelo Ipea.
      A versão dessazonalizada (PIMPFN12_QIIGSAS12) só começa em 1991-01, então recebe STL.

  br_prod_ind:
    nome: Produção industrial geral (Brasil, PIM-PF)
    pais: BR
    grupo: producao_industrial
    fonte: IBGE/SIDRA
    produtor: IBGE
    codigo_origem: "8888/v12607/c544[129314]"
    frequencia: M
    tipo_medida: nivel
    unidade: "índice 2022=100"
    ajuste_sazonal: true
    episodios: ["2007-2009", "2020"]
    url: https://sidra.ibge.gov.br/tabela/8888
    sidra: {tabela: 8888, nivel: n1, variavel: 12607, classificacoes: {"544": "129314"}}
    unidade_fonte: Número-índice
    faixa: [10, 300]
    conferido_em: >-
      2026-11-17: variável 12607 = "PIMPF - Número-índice com ajuste sazonal (2022=100)";
      categoria 129314 = "1 Indústria geral"; disponível de 2002-01 a 2026-09.

  eua_desemprego:
    nome: Taxa de desemprego (EUA)
    pais: EUA
    grupo: desemprego
    fonte: FRED
    produtor: U.S. Bureau of Labor Statistics
    codigo_origem: UNRATE
    frequencia: M
    tipo_medida: taxa
    unidade: "%"
    ajuste_sazonal: true
    episodios: ["1981-1982", "2007-2009", "2020"]
    url: https://fred.stlouisfed.org/series/UNRATE

  br_desemprego_pme_antiga:
    nome: Taxa de desemprego (Brasil, PME antiga)
    pais: BR
    grupo: desemprego
    fonte: Ipeadata
    produtor: IBGE
    codigo_origem: PME12_TDA12
    frequencia: M
    tipo_medida: taxa
    unidade: "%"
    ajuste_sazonal: false
    episodios: ["1981-1982"]
    url: http://www.ipeadata.gov.br/
    faixa: [0, 50]
    tratamentos: [stl]
    aviso_metodologia: >-
      PME antiga (desemprego aberto, referência 30 dias, regiões metropolitanas). Começa em
      1980-01: os meses de 1979-07 a 1979-12 da janela de exibição ficam sem dados.
    conferido_em: >-
      2026-11-17: "Taxa de desemprego - aberto - referência: 30 dias - RMs - INATIVA",
      IBGE/PME antiga, 1980-01 a 2002-12, sem lacunas de 1980 a 1987.

  br_desemprego_pme_nova:
    nome: Taxa de desemprego (Brasil, PME nova)
    pais: BR
    grupo: desemprego
    fonte: Ipeadata
    produtor: IBGE
    codigo_origem: PAN12_TD12
    frequencia: M
    tipo_medida: taxa
    unidade: "%"
    ajuste_sazonal: false
    episodios: ["2007-2009"]
    url: http://www.ipeadata.gov.br/
    faixa: [0, 50]
    tratamentos: [stl]
    conferido_em: >-
      2026-11-17: "Taxa de desemprego - INATIVA", IBGE/PME, 2002-03 a 2015-12, sem lacunas
      na janela de 2004-12 a 2013-12.

  br_desemprego_pnadc:
    nome: Taxa de desocupação (Brasil, PNAD Contínua, trimestre móvel)
    pais: BR
    grupo: desemprego
    fonte: IBGE/SIDRA
    produtor: IBGE
    codigo_origem: "6381"
    frequencia: M
    tipo_medida: taxa
    unidade: "%"
    ajuste_sazonal: false
    episodios: ["2020"]
    url: https://sidra.ibge.gov.br/tabela/6381
    sidra: {tabela: 6381, nivel: n1, variavel: 4099}
    unidade_fonte: "%"
    faixa: [0, 50]
    tratamentos: [stl]
    aviso_metodologia: "Trimestre móvel; data_ref = último mês do trimestre móvel."
    conferido_em: >-
      2026-11-17: tabela 6381, variável 4099 = "Taxa de desocupação, na semana de referência, das
      pessoas de 14 anos ou mais de idade" (%), trimestre móvel, 2012-03 a 2026-09.

  eua_juros:
    nome: Taxa dos fundos federais (EUA)
    pais: EUA
    grupo: juros
    fonte: FRED
    produtor: Federal Reserve Board
    codigo_origem: FEDFUNDS
    frequencia: M
    tipo_medida: taxa
    unidade: "% a.a."
    ajuste_sazonal: false
    episodios: ["1981-1982", "2007-2009", "2020"]
    url: https://fred.stlouisfed.org/series/FEDFUNDS

  br_juros:
