    unidade: "US$ milhões FOB deflacionados pelo CPI dos EUA"
    ajuste_sazonal: false
    episodios: ["1981-1982", "2007-2009", "2020"]
    url: http://www.ipeadata.gov.br/
    tratamentos: [{deflacionar: eua_cpi}, stl]
    conferido_em: >-
      2026-11-17: unidade "US$", multiplicador "milhões"; 1977-01 a 2026-10, sem lacunas nas
      três janelas.

  br_export_eua:
    nome: Exportações reais do Brasil para os EUA
    pais: BR
    grupo: exportacoes
    fonte: Comex Stat
    produtor: SECEX/MDIC
    codigo_origem: "exportação, país 249 (Estados Unidos)"
    frequencia: M
    tipo_medida: nivel
    unidade: "US$ FOB deflacionados pelo CPI dos EUA"
