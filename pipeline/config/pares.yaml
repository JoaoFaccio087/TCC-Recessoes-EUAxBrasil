# Pares BR × EUA por episódio (engenharia_de_dados.md, seção 4.2; D8, D19).
# Chave da ponte: (id_par, id_episodio). `SEM_DADOS` = sem série brasileira no episódio.
# unidade_comparacao: indice_pico_100 (nível) | pp_pico (taxa)

pares:
  producao_industrial:
    grupo: Produção industrial
    eua: eua_prod_ind
    br:
      "1981-1982": br_prod_ind_antiga
      "2007-2009": br_prod_ind
      "2020": br_prod_ind
    unidade_comparacao: indice_pico_100
    diferencas_metodologicas: >-
      EUA: índice dessazonalizado do Federal Reserve. Brasil: PIM-PF do IBGE; em 1981-1982 a série
      antiga não é dessazonalizada na fonte e recebe STL.

  desemprego:
    grupo: Desemprego
    eua: eua_desemprego
    br:
      "1981-1982": br_desemprego_pme_antiga
      "2007-2009": br_desemprego_pme_nova
      "2020": br_desemprego_pnadc
    unidade_comparacao: pp_pico
    diferencas_metodologicas: >-
      EUA: CPS, nacional, dessazonalizada. Brasil: PME (regiões metropolitanas) até 2015 e PNAD Contínua
      (nacional, trimestre móvel) depois; conceitos e cobertura diferentes entre episódios.

  juros:
    grupo: Juros
    eua: eua_juros
    br:
      "1981-1982": br_juros
      "2007-2009": br_juros
      "2020": br_juros
    unidade_comparacao: pp_pico
    diferencas_metodologicas: >-
      Fed funds × Over/Selic, ambas nominais em % a.a. Em 1981-1982 a taxa brasileira acompanha a
      inflação alta da época.
    observacao: "Fora de H1 (D25)."

  inflacao:
    grupo: Inflação
    eua: eua_inflacao
    br:
      "1981-1982": br_inflacao
      "2007-2009": br_inflacao
      "2020": br_inflacao
    unidade_comparacao: pp_pico
    diferencas_metodologicas: "CPI-U (dessazonalizado) × IPCA, ambos acumulados em 12 meses."

  pib:
    grupo: PIB
    eua: eua_pib
    br:
      "1981-1982": SEM_DADOS
      "2007-2009": br_pib_trim
      "2020": br_pib_trim
    unidade_comparacao: indice_pico_100
    diferencas_metodologicas: "Trimestral; pico trimestral do NBER. Brasil sem PIB trimestral antes de 1996 (D12)."

  acoes:
    grupo: Mercado acionário
    eua: eua_acoes
    br:
      "1981-1982": br_acoes
      "2007-2009": br_acoes
      "2020": br_acoes
    unidade_comparacao: indice_pico_100
    diferencas_metodologicas: >-
      Índice de ações dos EUA deflacionado pelo CPI × Ibovespa encadeado deflacionado pelo IPCA.

  exportacoes_total:
    grupo: Exportações totais × produção industrial dos EUA
    eua: eua_prod_ind
    br:
      "1981-1982": br_export_total
      "2007-2009": br_export_total
      "2020": br_export_total
    unidade_comparacao: indice_pico_100
    diferencas_metodologicas: >-
      Canal da demanda americana (D8): a produção industrial dos EUA é comparada às exportações
      brasileiras em US$ deflacionadas pelo CPI dos EUA (D10).

  exportacoes_eua:
    grupo: Exportações Brasil → EUA × produção industrial dos EUA
    eua: eua_prod_ind
    br:
      "1981-1982": SEM_DADOS
      "2007-2009": br_export_eua
      "2020": br_export_eua
    unidade_comparacao: indice_pico_100
    diferencas_metodologicas: "Como exportacoes_total, com destino EUA (Comex Stat, desde 1997)."

# Séries sem par: só resumo, sem defasagem, fora de H1.
sem_par: [br_cambio_real]
