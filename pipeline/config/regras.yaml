# Regras de cálculo (engenharia_de_dados.md, seção 7; D3, D4, D9, D11, D25).
versao: "1"

# Janelas em períodos relativos ao pico: meses (M) e trimestres (T).
janelas:
  M:
    coleta: [-36, 72]
    exibicao: [-24, 48]
    busca_reacao_pior: [0, 24]
    busca_recuperacao_max: 60
  T:
    coleta: [-12, 24]
    exibicao: [-8, 16]
    busca_reacao_pior: [0, 8]
    busca_recuperacao_max: 20

# Recuperação: períodos seguidos de volta ao nível do pico.
recuperacao_periodos: 2

# Limiar sobre valor_painel (índice com pico = 100, ou p.p. em relação ao pico) — Quadro 7.
# sentido_adverso: queda | alta | ambos
grupos:
  producao_industrial: {sentido_adverso: queda, limiar: 98,  n: 2}
  desemprego:          {sentido_adverso: alta,  limiar: 0.5, n: 2}
  juros:               {sentido_adverso: ambos, limiar: 1.0, n: 2, pior_e_recuperacao: false}
  inflacao:            {sentido_adverso: ambos, limiar: 1.0, n: 2, pior_e_recuperacao: false}
  cambio_real:         {sentido_adverso: queda, limiar: 95,  n: 2}
  exportacoes:         {sentido_adverso: queda, limiar: 95,  n: 2}
  pib:                 {sentido_adverso: queda, limiar: 99,  n: 1}
  acoes:               {sentido_adverso: queda, limiar: 90,  n: 2}

# Validação (seção 9). [PROPOSTA] limite de 90%.
cobertura_minima: 0.90

# Hipóteses (seção 7.6).
hipoteses:
  # Inflação fora da H1 pelo mesmo motivo dos juros (D25, D42).
  h1_pares: [producao_industrial, desemprego, acoes, exportacoes_total]
  h1_minimo_pares: 3
  # H2 e H3 por indicador (D42): chaves de pares.yaml; a série brasileira de cada episódio vem
  # da ponte. PIB fora (sem série trimestral em 1981-1982); só exportações totais (as únicas
  # com os três episódios).
  h2_h3_grupos: [producao_industrial, desemprego, exportacoes_total]
  h2_h3_minimo_grupos: 2
