[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tcc-pipeline"
version = "0.1.0"
description = "Pipeline em lote do TCC: recessões EUA × Brasil (Bronze, Silver, Gold e edições publicadas)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyyaml>=6",
    "psutil>=5.9",
    "requests>=2.32",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["testes"]
addopts = "-q -p no:cacheprovider"
